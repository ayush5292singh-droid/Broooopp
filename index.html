<!DOCTYPE html>
<html>

<head>

<title>Finance Manager AI</title>

<link rel="stylesheet" href="style.css">

</head>

<body>


<div class="app">

<h1>💰 Finance Manager AI</h1>


<div class="robot">

<div class="face">
🤖
</div>

<h2 id="question">
Hello! What is your monthly salary?
</h2>

</div>



<div class="input-box">

<input 
id="answer"
placeholder="Enter your answer">


<button onclick="nextQuestion()">
Next
</button>
<button onclick="toggleMode()">
🌙 Dark Mode
</button>
  
</div>


<div class="result">

<h3 id="result">
Your advice will appear here.
</h3>

</div>


<div class="tracker">

<input id="expense" placeholder="Enter today's expense">

<button onclick="addExpense()">
Add Expense
</button>


<p id="expenseList">
No expenses added
</p>

</div>


</div>



<script src="script.js"></script>


</body>

</html>
